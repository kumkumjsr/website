<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Hall of Fame | Smart Study</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --gold: #ffd700;
            --bg: #051b31;
            --card-bg: rgba(255, 255, 255, 0.07);
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .leaderboard-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); font-size: 2.5rem; margin: 0; text-transform: uppercase; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 15px; color: var(--primary); border-bottom: 2px solid rgba(255,255,255,0.1); }
        td { padding: 18px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .rank-circle {
            width: 35px; height: 35px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-weight: bold;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .rank-1 { background: var(--gold); color: #000; border: none; box-shadow: 0 0 15px var(--gold); }
        .rank-2 { background: #c0c0c0; color: #000; border: none; }
        .rank-3 { background: #cd7f32; color: #000; border: none; }

        .user-cell { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 35px; height: 35px; background: var(--primary); color: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        .bar-container { width: 100px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); transition: width 1s ease-in-out; }

        tr { opacity: 0; transform: translateY(20px); animation: slideUp 0.5s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .btn-home {
            display: block; width: fit-content; margin: 30px auto 0;
            padding: 12px 35px; background: var(--primary); color: var(--bg);
            text-decoration: none; border-radius: 50px; font-weight: bold;
            transition: 0.3s;
        }
        .btn-home:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 242, 254, 0.4); }

        .error-msg { text-align: center; color: #ff4d4d; padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="leaderboard-container">
        <div class="header">
            <h1><i class="fas fa-crown"></i> Hall of Fame</h1>
            <p>Top Performing Students Worldwide</p>
        </div>

        <table id="leaderboardTable">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Student</th>
                    <th>Score</th>
                    <th>Percentage</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                </tbody>
        </table>

        <a href="roadmap.html" class="btn-home">Continue Roadmap</a>
    </div>

    <script>
        async function fetchLeaderboard() {
            const body = document.getElementById('leaderboardBody');
            
            try {
                // We use the full URL to ensure the browser finds the local server
                const response = await fetch('http://localhost:3000/api/leaderboard');
                
                if (!response.ok) throw new Error("Server not responding");

                const data = await response.json();

                if (data.length === 0) {
                    body.innerHTML = `<tr><td colspan="5" class="error-msg">No records found. Be the first to finish!</td></tr>`;
                    return;
                }

                body.innerHTML = data.map((user, index) => {
                    const rank = index + 1;
                    const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
                    const date = new Date(user.last_test_date).toLocaleDateString();

                    return `
                        <tr style="animation-delay: ${index * 0.1}s">
                            <td><div class="rank-circle ${rankClass}">${rank}</div></td>
                            <td>
                                <div class="user-cell">
                                    <div class="avatar">${user.username.charAt(0).toUpperCase()}</div>
                                    <span>${user.username}</span>
                                </div>
                            </td>
                            <td><strong>${user.score}</strong> / 15</td>
                            <td>
                                <div style="display:flex; align-items:center; gap:8px">
                                    <div class="bar-container"><div class="bar-fill" style="width:${user.percentage}%"></div></div>
                                    <span style="font-size: 0.8rem">${user.percentage}%</span>
                                </div>
                            </td>
                            <td style="font-size: 0.85rem; opacity: 0.7;">${date}</td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error("Fetch Error:", err);
                body.innerHTML = `<tr><td colspan="5" class="error-msg">
                    ⚠️ Connection Error: Is your Node.js server running on port 3000?
                </td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchLeaderboard);
    </script>
</body>
</html>
